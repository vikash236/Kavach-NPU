[package]
name = "kavach-npu"
version = "0.3.0-alpha"
edition = "2024"
license = "MIT"
publish = false

[workspace]
members = [
    "crates/kavach-core",
    "crates/kavach-tripwire",
    "crates/kavach-beacon",
    "crates/kavach-firewall",
    "crates/kavach-events",
    "crates/kavach-wsl",
    "crates/kavach-sensors",
    "crates/kavach-wsl-guest",
    "kavach-train",
    "tools/kavach-pack",
    "tools/threat-injector",
]
resolver = "3"

[dependencies]
kavach-core = { path = "crates/kavach-core" }
kavach-tripwire = { path = "crates/kavach-tripwire" }
kavach-beacon = { path = "crates/kavach-beacon" }
kavach-firewall = { path = "crates/kavach-firewall" }
kavach-events = { path = "crates/kavach-events" }
kavach-wsl = { path = "crates/kavach-wsl" }
hex = "0.4"

[target.'cfg(windows)'.dependencies]
kavach-sensors = { path = "crates/kavach-sensors" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "tripwire"
harness = false

[[bench]]
name = "beacon"
harness = false

[[bench]]
name = "events"
harness = false

[[bench]]
name = "wsl"
harness = false

[[bench]]
name = "stress"
harness = false

