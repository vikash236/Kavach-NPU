[package]
name = "kavach-npu"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
members = [
    "crates/kavach-core",
    "crates/kavach-tripwire",
    "crates/kavach-beacon",
    "crates/kavach-firewall",
    "crates/kavach-events",
    "crates/kavach-wsl",
    "kavach-train",
]
resolver = "3"

[dependencies]
kavach-core = { path = "crates/kavach-core" }
kavach-tripwire = { path = "crates/kavach-tripwire" }
kavach-beacon = { path = "crates/kavach-beacon" }
kavach-firewall = { path = "crates/kavach-firewall" }
kavach-events = { path = "crates/kavach-events" }
kavach-wsl = { path = "crates/kavach-wsl" }
hex = "0.4"

