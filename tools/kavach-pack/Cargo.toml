[package]
name = "kavach-pack"
version = "0.3.0-alpha"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "kavach-pack"
path = "src/main.rs"

[dependencies]
kavach-core = { path = "../../crates/kavach-core" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
